[workspace]
members = [
    "crates/actions_router",
    "crates/preprocessor",
    "crates/renderer",
    "crates/mesher",
    "crates/solver",
]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["roman shushakov <roman.a.shushakov1@gmail.com>"]
version = "0.1.0"

[profile.release]
lto = true
opt-level = 3

[workspace.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen-futures = "0.4.79"
serde_derive = "1.0.229"
rand = "0.10.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
serde-wasm-bindgen = "0.6.5"
web-sys = "0.3.106"
mat4 = "0.2.1"
vec4 = "0.2.1"

extended_matrix = "0.9.9"
finite_element_method = "0.9.12"
iterative_solvers_smpl = "0.1.5"
